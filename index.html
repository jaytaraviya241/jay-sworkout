document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

d:transparent;color:#F2EFE7;font-family:Archivo,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer\">Skip<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"margin-top:16px;background:rgba(255,255,255,.07);border-radius:12px;padding:14px 16px\">\n              <div style=\"font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;color:#CFC7B4\">Warm-up · 8–10 min<\u002Fdiv>\n              <sc-for list=\"{{ selWarmup }}\" as=\"w\" hint-placeholder-count=\"3\">\n                <div style=\"font-size:14px;line-height:1.55;color:#EDE8DB\">— {{ w }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;margin-top:14px\">\n              <sc-for list=\"{{ selEx }}\" as=\"ex\" hint-placeholder-count=\"6\">\n                <div style=\"border-bottom:1px solid rgba(255,255,255,.12)\">\n                  <button sc-camel-on-click=\"{{ ex.toggle }}\" style=\"display:flex;gap:14px;padding:13px 2px;align-items:baseline;width:100%;background:transparent;border:none;cursor:pointer;text-align:left;color:#F2EFE7;font-family:'Instrument Sans',sans-serif\">\n                    <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:13px;color:#E8946B;min-width:22px\">{{ ex.i }}<\u002Fdiv>\n                    <div style=\"flex:1\">\n                      <div style=\"font-weight:600;font-size:15.5px\">{{ ex.n }}<\u002Fdiv>\n                      <sc-if value=\"{{ ex.altText }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12.5px;color:#A79E8B;margin-top:2px\">No equipment? {{ ex.altText }}<\u002Fdiv><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"text-align:right;flex:none\">\n                      <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:14.5px;white-space:nowrap\">{{ ex.s }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#A79E8B;white-space:nowrap\">rest {{ ex.r }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"flex:none;font-family:Archivo,sans-serif;font-weight:800;font-size:11.5px;color:{{ ex.setBadgeDone }};background:rgba(255,255,255,.08);border-radius:999px;padding:5px 10px;white-space:nowrap\">{{ ex.setBadge }}<\u002Fdiv>\n                    <div style=\"flex:none;font-family:Archivo,sans-serif;font-weight:800;font-size:17px;color:#E8946B;width:18px;text-align:center\">{{ ex.chev }}<\u002Fdiv>\n                  <\u002Fbutton>\n                  <sc-if value=\"{{ ex.open }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:4px 2px 18px 36px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start\">\n                      <div style=\"flex:none;width:196px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 8px 2px\">\n                        <x-import component-from-global-scope=\"exercise-demo\" from=\"d5cd1f91-5c60-4f68-a405-49cdea7d36d6#/exercise-demo.js\" name=\"{{ ex.n }}\" hint-size=\"180px,180px\"><\u002Fx-import>\n                        <div style=\"font-size:9.5px;font-weight:700;letter-spacing:1.5px;color:#A79E8B;text-align:center;padding:3px 0 6px\">MOVEMENT DEMO<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"flex:1;min-width:230px;display:flex;flex-direction:column;gap:10px\">\n                        <div style=\"font-size:12px;letter-spacing:.5px;color:#E8946B;font-weight:700;text-transform:uppercase\">Targets: <span style=\"color:#EDE8DB;text-transform:none;letter-spacing:0;font-weight:600\">{{ ex.targetLine }}<\u002Fspan><\u002Fdiv>\n                        <div style=\"font-size:13.5px;line-height:1.6;color:#CFC7B4\">{{ ex.cue }}<\u002Fdiv>\n                        <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                          <span style=\"font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#A79E8B\">Sets:<\u002Fspan>\n                          <sc-for list=\"{{ ex.setsArr }}\" as=\"st\" hint-placeholder-count=\"4\">\n                            <button sc-camel-on-click=\"{{ st.on }}\" style=\"width:32px;height:32px;border-radius:8px;border:1.5px solid {{ st.bd }};background:{{ st.bg }};color:{{ st.fg }};font-family:Archivo,sans-serif;font-weight:800;font-size:13px;cursor:pointer\">{{ st.n }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                        <div style=\"background:rgba(255,255,255,.07);border-radius:12px;padding:13px 14px\">\n                          <div style=\"font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#CFC7B4\">Log today's top set<\u002Fdiv>\n                          <div style=\"display:flex;gap:8px;margin-top:9px;align-items:center\">\n                            <input value=\"{{ logW }}\" sc-camel-on-change=\"{{ onLogW }}\" sc-camel-input-mode=\"decimal\" placeholder=\"kg\" style=\"width:60px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:8px 10px;color:#F2EFE7;font-family:Archivo,sans-serif;font-weight:700;font-size:14px\">\n                            <span style=\"color:#A79E8B;font-weight:700\">×<\u002Fspan>\n                            <input value=\"{{ logR }}\" sc-camel-on-change=\"{{ onLogR }}\" sc-camel-input-mode=\"numeric\" placeholder=\"reps\" style=\"width:52px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:8px 10px;color:#F2EFE7;font-family:Archivo,sans-serif;font-weight:700;font-size:14px\">\n                            <button sc-camel-on-click=\"{{ ex.save }}\" style=\"padding:9px 16px;border-radius:8px;border:none;background:#C2410C;color:#fff;font-family:Archivo,sans-serif;font-weight:800;font-size:12px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer\">Save<\u002Fbutton>\n                          <\u002Fdiv>\n                          <div style=\"font-size:12.5px;color:#CFC7B4;margin-top:8px\">{{ ex.lastLine }}<\u002Fdiv>\n                          <sc-if value=\"{{ ex.hasSpark }}\" hint-placeholder-val=\"{{ false }}\">\n                            <svg sc-camel-view-box=\"0 0 140 36\" style=\"width:140px;height:36px;margin-top:6px;display:block\"><polyline points=\"{{ ex.spark }}\" fill=\"none\" stroke=\"#E8946B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fsvg>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ selHasCore }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;background:rgba(255,255,255,.07);border-radius:12px;padding:14px 16px\">\n                <div style=\"font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;color:#CFC7B4\">Core finisher<\u002Fdiv>\n                <sc-for list=\"{{ selCore }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div style=\"font-size:14px;line-height:1.55;color:#EDE8DB\">— {{ c }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"margin-top:14px;border:1.5px dashed rgba(232,148,107,.6);border-radius:12px;padding:13px 16px\">\n              <span style=\"font-weight:700;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#E8946B\">Cardio<\u002Fspan>\n              <div style=\"font-size:14px;margin-top:4px;line-height:1.5\">{{ selCardio }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;font-size:13px;line-height:1.6;color:#CFC7B4\"><strong style=\"color:#F2EFE7\">Progression:<\u002Fstrong> when you hit the top of the rep range on all sets with clean form, add 2.5 kg (5 kg on leg press) next session. Log your last set in the weekly check-in. Fail the same weight twice? Drop 10% and build back.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ selIsRest }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:16px\">\n              <div style=\"font-family:Archivo,sans-serif;font-weight:900;font-size:24px;text-transform:uppercase\">Recovery day<\u002Fdiv>\n              <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ selRestActs }}\" as=\"ra\" hint-placeholder-count=\"3\">\n                  <div style=\"background:rgba(255,255,255,.07);border-radius:12px;padding:13px 16px;font-size:14.5px;line-height:1.5\">{{ ra }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;font-size:13px;line-height:1.6;color:#CFC7B4\">{{ selRestNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px\">\n              <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">Today's meals<\u002Fdiv>\n              <div style=\"font-size:12.5px;font-weight:600;color:#6E6656\">{{ macroLine }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;margin-top:10px\">\n              <sc-for list=\"{{ selMeals }}\" as=\"m\" hint-placeholder-count=\"7\">\n                <div style=\"display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #EBE5D4\">\n                  <div style=\"flex:none;width:64px;font-family:Archivo,sans-serif;font-weight:700;font-size:12px;color:#8A8272;padding-top:2px\">{{ m.t }}<\u002Fdiv>\n                  <div style=\"flex:1\">\n                    <div style=\"font-weight:700;font-size:15px\">{{ m.name }}<\u002Fdiv>\n                    <sc-for list=\"{{ m.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                      <div style=\"font-size:13.5px;line-height:1.55;color:#4A4438\">· {{ it }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                    <div style=\"font-size:12.5px;color:#9A6A3F;margin-top:4px;font-style:italic\">Swap: {{ m.swap }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n              <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">Daily checklist · {{ selDateLabel }}<\u002Fdiv>\n              <div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:14px\">{{ checkPct }}%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:6px;background:#EBE5D4;border-radius:99px;margin:12px 0 14px;overflow:hidden\"><div style=\"height:100%;background:#C2410C;border-radius:99px;width:{{ checkPct }}%\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ checkRows }}\" as=\"ck\" hint-placeholder-count=\"7\">\n                <button sc-camel-on-click=\"{{ ck.on }}\" style=\"display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;border:1.5px solid {{ ck.bd }};background:{{ ck.bg }};cursor:pointer;text-align:left;font-family:'Instrument Sans',sans-serif\">\n                  <span style=\"flex:none;width:20px;height:20px;border-radius:6px;border:2px solid {{ ck.boxBd }};background:{{ ck.boxBg }};display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800\">{{ ck.mark }}<\u002Fspan>\n                  <span style=\"font-size:14.5px;font-weight:600;color:{{ ck.fg }}\">{{ ck.label }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isWeekly }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px;align-items:start\">\n        <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">This week's check-in<\u002Fdiv>\n          <div style=\"font-size:13px;color:#6E6656;margin-top:6px;line-height:1.5\">Do this every Sunday morning — same time, before breakfast, after the washroom. Take your progress photo in the same spot and lighting each week.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px\">\n            <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <label style=\"display:flex;flex-direction:column;gap:5px\">\n                <span style=\"font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#8A8272\">{{ f.label }}<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:6px;background:#F5F1E6;border:1.5px solid #E2DCCA;border-radius:10px;padding:9px 12px\">\n                  <input value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.on }}\" sc-camel-input-mode=\"decimal\" placeholder=\"—\" style=\"border:none;background:transparent;font-family:Archivo,sans-serif;font-weight:700;font-size:16px;width:100%;color:#17140E\">\n                  <span style=\"font-size:12px;font-weight:600;color:#8A8272;flex:none\">{{ f.unit }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:18px\">\n            <sc-for list=\"{{ ratingRows }}\" as=\"rr\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n                <span style=\"font-size:13px;font-weight:600\">{{ rr.label }}<\u002Fspan>\n                <span style=\"display:flex;gap:5px\">\n                  <sc-for list=\"{{ rr.opts }}\" as=\"op\" hint-placeholder-count=\"5\">\n                    <button sc-camel-on-click=\"{{ op.on }}\" style=\"min-width:34px;padding:7px 0;border-radius:8px;border:1.5px solid {{ op.bd }};background:{{ op.bg }};color:{{ op.fg }};font-family:Archivo,sans-serif;font-weight:700;font-size:13px;cursor:pointer\">{{ op.v }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ saveWeek }}\" style=\"margin-top:20px;width:100%;padding:14px;border-radius:12px;border:none;background:#C2410C;color:#fff;font-family:Archivo,sans-serif;font-weight:800;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer\">{{ saveLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">History<\u002Fdiv>\n          <sc-if value=\"{{ hasEntries }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;margin-top:8px\">\n              <sc-for list=\"{{ entryRows }}\" as=\"en\" hint-placeholder-count=\"3\">\n                <div style=\"padding:13px 0;border-bottom:1px solid #EBE5D4\">\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:baseline\">\n                    <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:14px\">{{ en.date }}<\u002Fspan>\n                    <span style=\"font-size:13px;font-weight:600;color:#6E6656\">{{ en.body }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#8A8272;margin-top:3px\">{{ en.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noEntries }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:14px;border:1.5px dashed #D6CEB8;border-radius:12px;padding:20px;font-size:13.5px;color:#8A8272;line-height:1.6\">No check-ins yet. Your first entry becomes the baseline — weight, waist and lift numbers from week 1 are what everything else gets compared against. Expect weight to move slowly (recomposition ≈ 1–2 kg/month change) while waist shrinks and lifts climb — waist + lifts are the real scoreboard.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"margin-top:16px;background:#F5F1E6;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.6;color:#4A4438\"><strong>What good progress looks like:<\u002Fstrong> waist down ~1 cm/month, lifts up a little most weeks, weight roughly stable or drifting down 0.5–1 kg/month. If waist isn't moving for 3 weeks, cut 1 roti or the bedtime milk. If lifts stall and sleep is bad, fix sleep before touching food.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">Trends<\u002Fdiv>\n          <sc-if value=\"{{ noChart }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:14px;border:1.5px dashed #D6CEB8;border-radius:12px;padding:20px;font-size:13.5px;color:#8A8272;line-height:1.6\">Charts draw themselves after your second weekly check-in — a body-weight line, a waist line, and a trend for each key lift.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasWChart }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:14px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#8A8272\">Body weight<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:#6E6656\">{{ wFirst }} → {{ wLast }} kg<\u002Fspan><\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 460 120\" style=\"width:100%;height:auto;margin-top:5px;background:#F5F1E6;border-radius:10px\"><polyline points=\"{{ wPts }}\" fill=\"none\" stroke=\"#C2410C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasWaChart }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:14px\"><span style=\"font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#8A8272\">Waist<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:#6E6656\">{{ waFirst }} → {{ waLast }} cm<\u002Fspan><\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 460 120\" style=\"width:100%;height:auto;margin-top:5px;background:#F5F1E6;border-radius:10px\"><polyline points=\"{{ waPts }}\" fill=\"none\" stroke=\"#17140E\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fsvg>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:16px\">\n            <sc-for list=\"{{ liftTrends }}\" as=\"lt\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:12px;justify-content:space-between\">\n                <span style=\"font-size:13px;font-weight:600;min-width:104px\">{{ lt.label }}<\u002Fspan>\n                <sc-if value=\"{{ lt.has }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 150 34\" style=\"width:150px;height:34px;background:#F5F1E6;border-radius:8px\"><polyline points=\"{{ lt.pts }}\" fill=\"none\" stroke=\"#C2410C\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fsvg><\u002Fsc-if>\n                <span style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:13.5px;min-width:56px;text-align:right\">{{ lt.last }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n          <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">Your data<\u002Fdiv>\n          <div style=\"font-size:13.5px;line-height:1.65;color:#4A4438;margin-top:12px\">Everything — weekly check-ins, logged sets, daily checklists — is saved <strong>in this browser, on this device<\u002Fstrong>. Nothing is uploaded anywhere, so it works perfectly on GitHub Pages. Download a backup after your Sunday check-in; restore it on a new phone or laptop to carry your history over.<\u002Fdiv>\n          <div style=\"display:flex;gap:26px;margin-top:16px;flex-wrap:wrap\">\n            <div><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:22px\">{{ statWeeks }}<\u002Fdiv><div style=\"font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#8A8272\">Check-ins<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:22px\">{{ statSets }}<\u002Fdiv><div style=\"font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#8A8272\">Sets logged<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:22px\">{{ statDays }}<\u002Fdiv><div style=\"font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#8A8272\">Days tracked<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-top:18px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ exportData }}\" style=\"flex:1;min-width:150px;padding:13px;border-radius:11px;border:none;background:#17140E;color:#F2EFE7;font-family:Archivo,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer\">Download backup<\u002Fbutton>\n            <label style=\"flex:1;min-width:150px;padding:13px;border-radius:11px;border:1.5px solid #17140E;background:transparent;color:#17140E;font-family:Archivo,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-align:center;box-sizing:border-box\"><input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ importData }}\" style=\"display:none\">Restore backup<\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isGuide }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div style=\"background:#17140E;color:#F2EFE7;border-radius:18px;padding:24px 26px\">\n            <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#E8946B\">The approach — recomposition<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.7;margin-top:12px\">You're 26, 180 cm, ~80 kg, with 1–3 years of training and 3–6 months off. That's the best possible setup for <strong>body recomposition<\u002Fstrong>: muscle memory brings old muscle back fast while a small calorie deficit burns belly fat. No bulking, no crash cutting.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px\">\n              <div style=\"background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px\"><div style=\"font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#CFC7B4\">Calories<\u002Fdiv><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:19px;margin-top:2px\">≈2,200<\u002Fdiv><div style=\"font-size:11.5px;color:#A79E8B\">2,050 on rest days<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px\"><div style=\"font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#CFC7B4\">Protein<\u002Fdiv><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:19px;margin-top:2px\">140–150 g<\u002Fdiv><div style=\"font-size:11.5px;color:#A79E8B\">≈1.8 g per kg<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px\"><div style=\"font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#CFC7B4\">Carbs<\u002Fdiv><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:19px;margin-top:2px\">≈235 g<\u002Fdiv><div style=\"font-size:11.5px;color:#A79E8B\">fuel for lifting<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px\"><div style=\"font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#CFC7B4\">Fat<\u002Fdiv><div style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:19px;margin-top:2px\">≈65 g<\u002Fdiv><div style=\"font-size:11.5px;color:#A79E8B\">ghee/oil counted<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.65;color:#CFC7B4;margin-top:14px\">Protein map for a typical day: whey 1.5 scoops (~36 g) + paneer 150 g (~27 g) + dal/beans/sprouts across meals (~35 g) + curd, chaas &amp; milk (~20 g) + roti/rotla, chilla, nuts (~25 g) ≈ <strong style=\"color:#F2EFE7\">143 g<\u002Fstrong>.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n            <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">How your foods actually work<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:14px;font-size:14px;line-height:1.65;color:#4A4438\">\n              <div><strong>No food burns belly fat.<\u002Fstrong> Not chia, not lemon water, not any \"metabolism booster\". Fat leaves when you're in a small calorie deficit for months. Every food below earns its place another way:<\u002Fdiv>\n              <div><strong>Chia seeds<\u002Fstrong> — fibre + omega-3 + fullness. 1 tbsp soaked 20 min in water or chaas, mid-morning. It helps you eat less later; it does nothing directly to your stomach fat.<\u002Fdiv>\n              <div><strong>Dry fruits<\u002Fstrong> — great nutrients, very calorie-dense. One small handful (~30 g, ≈180 kcal) per day, counted. \"Healthy\" doesn't mean unlimited — this is the #1 silent calorie leak.<\u002Fdiv>\n              <div><strong>Fruits<\u002Fstrong> — 2 whole fruits a day, ideally around activity. Whole fruit, never juice: juice removes the fibre and keeps the sugar.<\u002Fdiv>\n              <div><strong>Beans, sprouts &amp; fibre<\u002Fstrong> — your protein workhorses. They also keep you full, which is how \"fibre helps fat loss\" actually works — through appetite, not magic.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n            <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">Hydration &amp; sleep<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:14px;font-size:14px;line-height:1.65;color:#4A4438\">\n              <div>· <strong>3–3.5 L water daily<\u002Fstrong> — 500 ml on waking, 750 ml around the workout, then a glass before each meal. Chaas counts; chai and juice don't.<\u002Fdiv>\n              <div>· <strong>Sleep 7–8 h.<\u002Fstrong> You're at 6–7 now — pulling this to 7.5 will do more for muscle and belly fat than any supplement. Fixed lights-out time; no screens in bed; last chai before 5 PM.<\u002Fdiv>\n              <div>· <strong>Desk job antidote:<\u002Fstrong> 8,000 steps. Split it — 10 min after lunch, 10 min after dinner, and the rest happens on its own.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n            <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">Progression method<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:14px;font-size:14px;line-height:1.65;color:#4A4438\">\n              <div><strong>1. Double progression.<\u002Fstrong> Every lift has a rep range (e.g. 6–8). Start at the bottom with a weight you control. Add reps each week. When all sets hit the top number with clean form → add 2.5 kg (5 kg on leg press/squat) and restart at the bottom.<\u002Fdiv>\n              <div><strong>2. First 2 weeks = runway.<\u002Fstrong> Use weights that feel like 7/10 effort. Muscle memory is real — strength will come back fast, don't chase your old numbers on day one.<\u002Fdiv>\n              <div><strong>3. Stall rule.<\u002Fstrong> Fail the same weight twice → drop 10%, build back up. Every 8 weeks take an easy week (same exercises, half the sets).<\u002Fdiv>\n              <div><strong>4. Log it.<\u002Fstrong> The weekly check-in tracks bench, squat, pulldown and overhead press. Rising lifts + shrinking waist = recomposition working.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n            <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">Limit / avoid<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:14px;line-height:1.6;color:#4A4438\">\n              <div>· Fried farsan — bhajiya, fafda, sev, gathiya: weekends only, small plate<\u002Fdiv>\n              <div>· Mithai &amp; sugar — chai max 2 cups, ½–1 tsp sugar each<\u002Fdiv>\n              <div>· Maida — white bread, biscuits, khari with chai<\u002Fdiv>\n              <div>· Ghee/oil — 3–4 tsp oil total across the day's cooking; 1 tsp ghee on roti is fine, counted<\u002Fdiv>\n              <div>· Fruit juice &amp; sugary drinks — eat the fruit instead<\u002Fdiv>\n              <div>· Eating after 9:30 PM — late meals + 6 AM training don't mix<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n            <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">Flexible meals<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.65;color:#4A4438;margin-top:12px\"><strong>1–2 free meals per week<\u002Fstrong> — a meal, not a whole day. Family dinner, wedding, Sunday thali: eat normally, enjoy it, apply two rules — no seconds on fried items, dessert small or shared. Then the next meal goes straight back to plan. One flexible meal changes nothing; guilt-driven \"diet starts Monday\" spirals change everything.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFDF7;border:1px solid #E2DCCA;border-radius:18px;padding:24px 26px\">\n            <div style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#C2410C\">Quick substitutions<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:13.5px;line-height:1.6;color:#4A4438\">\n              <div>· No paneer → moong-dal khichdi + kadhi + 1 glass milk at night<\u002Fdiv>\n              <div>· No whey (travel) → 1 glass milk + 2 tbsp peanuts + roasted chana<\u002Fdiv>\n              <div>· No sprouts → boiled chana or moong chaat, same portion<\u002Fdiv>\n              <div>· No besan chilla → masala oats + curd, or moong chilla<\u002Fdiv>\n              <div>· No dal at lunch → kadhi + extra curd, or rajma/chole<\u002Fdiv>\n              <div>· No fresh sabzi → kachumber salad + extra dal<\u002Fdiv>\n              <div>· Gym closed → 40 min brisk incline walk + the day's core work at home<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showAlternatives&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Workout&quot;}, &quot;waterLitres&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 3, &quot;min&quot;: 2.5, &quot;max&quot;: 4, &quot;step&quot;: 0.25, &quot;unit&quot;: &quot;L&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Daily targets&quot;}, &quot;stepTarget&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 8000, &quot;min&quot;: 5000, &quot;max&quot;: 15000, &quot;step&quot;: 500, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Daily targets&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const dow = (new Date().getDay() + 6) % 7;\n    this.state = { tab: 'today', sel: dow, checks: this.loadChecks(dow), openEx: null, logW: '', logR: '', exlog: this.loadExlog(), setsDone: this.loadSetsDone(dow), timer: null, entries: [], draft: { weight:'', waist:'', bench:'', squat:'', pulldown:'', ohp:'', workouts:null, energy:null, sleepq:null, diet:null }, saved: false };\n  }\n  componentDidMount() {\n    try { const e = JSON.parse(localStorage.getItem('vfit-weekly') || '[]'); this.setState({ entries: e }); } catch (err) {}\n    this._iv = setInterval(() => {\n      this.setState((s) => (!s.timer || s.timer.left <= 0) ? null : { timer: { ...s.timer, left: s.timer.left - 1 } });\n    }, 1000);\n  }\n  componentWillUnmount() { clearInterval(this._iv); }\n  loadSetsDone(i) { try { return JSON.parse(localStorage.getItem('vfit-sets-' + this.iso(this.dateFor(i))) || '{}'); } catch (e) { return {}; } }\n  saveSetsDone(i, obj) { localStorage.setItem('vfit-sets-' + this.iso(this.dateFor(i)), JSON.stringify(obj)); }\n  parseRest(str) {\n    const nums = (str.match(/\\d+/g) || [1]).map(Number);\n    const avg = nums.reduce((a, b) => a + b, 0) / nums.length;\n    return Math.round(/min/i.test(str) ? avg * 60 : avg);\n  }\n  toggleSet(exIdx, si, setCount, restStr) {\n    const store = { ...this.state.setsDone };\n    const arr = (store[exIdx] ? [...store[exIdx]] : new Array(setCount).fill(false));\n    const wasDone = arr[si];\n    arr[si] = !wasDone;\n    store[exIdx] = arr;\n    this.saveSetsDone(this.state.sel, store);\n    const patch = { setsDone: store };\n    if (!wasDone) patch.timer = { key: exIdx + '-' + si, total: this.parseRest(restStr), left: this.parseRest(restStr) };\n    this.setState(patch);\n  }\n  dateFor(i) { const t = new Date(); const dow = (t.getDay() + 6) % 7; const d = new Date(t); d.setDate(t.getDate() - dow + i); return d; }\n  iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }\n  fmt(d) { return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }\n  loadChecks(i) { try { return JSON.parse(localStorage.getItem('vfit-checks-' + this.iso(this.dateFor(i))) || '{}'); } catch (e) { return {}; } }\n  saveChecks(i, c) { localStorage.setItem('vfit-checks-' + this.iso(this.dateFor(i)), JSON.stringify(c)); }\n  loadExlog() { try { return JSON.parse(localStorage.getItem('vfit-exlog') || '{}'); } catch (e) { return {}; } }\n  exMeta() {\n    const M = (mus, cue) => ({ mus, cue });\n    return {\n      'Barbell bench press': M(['chest', 'delts', 'triceps'], 'Feet planted, slight arch, bar to mid-chest, press up and slightly back.'),\n      'Incline dumbbell press': M(['chest', 'delts', 'triceps'], '30\\u201345\\u00b0 bench. Press up and slightly in \\u2014 don\\u2019t clang the dumbbells.'),\n      'Seated dumbbell shoulder press': M(['delts', 'triceps'], 'Elbows just in front of shoulders, core braced.'),\n      'Dumbbell lateral raise': M(['delts'], 'Lead with the elbows, stop at shoulder height, no swinging.'),\n      'Pec-deck / cable fly': M(['chest'], 'Hug-a-tree arc; squeeze 1 sec where the hands meet.'),\n      'Rope triceps pushdown': M(['triceps'], 'Elbows pinned to your sides; split the rope at the bottom.'),\n      'Overhead dumbbell triceps extension': M(['triceps'], 'Elbows close to ears; deep stretch, no bouncing.'),\n      'Lat pulldown (or pull-ups)': M(['lats', 'biceps', 'forearms'], 'Chest up, pull the bar to your collarbone, elbows to back pockets.'),\n      'Barbell row': M(['lats', 'traps', 'rearDelts', 'biceps', 'lowerBack'], 'Hinge ~45\\u00b0, flat back, pull to the lower ribs.'),\n      'Seated cable row': M(['lats', 'traps', 'biceps'], 'Tall torso; squeeze the shoulder blades together each rep.'),\n      'Face pull': M(['rearDelts', 'traps'], 'Pull to eyebrow height, thumbs pointing back, 1-sec hold.'),\n      'EZ-bar curl': M(['biceps', 'forearms'], 'Elbows still; 2-sec lowering on every rep.'),\n      'Hammer curl': M(['biceps', 'forearms'], 'Neutral grip, no shoulder swing.'),\n      'Barbell back squat': M(['quads', 'glutes', 'hamstrings', 'lowerBack', 'abs'], 'Brace hard, sit down between your hips, drive through mid-foot.'),\n      'Romanian deadlift': M(['hamstrings', 'glutes', 'lowerBack'], 'Soft knees, push hips back, bar brushes the legs.'),\n      'Leg press': M(['quads', 'glutes'], 'Whole foot on the plate; never lock the knees hard.'),\n      'Lying leg curl': M(['hamstrings'], 'Hips pinned to the pad; squeeze at the top.'),\n      'Standing calf raise': M(['calves'], 'Full stretch at the bottom, 1-sec pause at the top.'),\n      'Incline barbell press': M(['chest', 'delts', 'triceps'], 'Bar to upper chest, wrists stacked over elbows.'),\n      'Weighted / assisted pull-up': M(['lats', 'biceps', 'forearms'], 'Full hang to chin over bar. No kipping.'),\n      'Flat dumbbell press': M(['chest', 'delts', 'triceps'], 'Slight arc inward at the top, full stretch at the bottom.'),\n      'One-arm dumbbell row': M(['lats', 'rearDelts', 'biceps'], 'Flat back; pull to the hip, not the shoulder.'),\n      'Cable lateral raise': M(['delts'], 'Constant tension; stop at shoulder height.'),\n      'Superset: EZ-bar curl + rope pushdown': M(['biceps', 'triceps', 'forearms'], 'No rest inside the pair; 60 sec after both moves.'),\n      'Standing barbell overhead press': M(['delts', 'triceps', 'traps', 'abs'], 'Squeeze glutes, ribs down, press to full lockout.'),\n      'Rear-delt dumbbell fly': M(['rearDelts', 'traps'], 'Hinge or chest-support; lead with the pinkies.'),\n      'Barbell curl': M(['biceps', 'forearms'], 'Shoulder-width grip; no lower-back lean.'),\n      'Incline dumbbell curl': M(['biceps'], 'Let the arms hang back for a deep stretch.'),\n      'Close-grip bench press': M(['triceps', 'chest'], 'Hands shoulder-width, elbows tucked to the sides.'),\n      'Skull crusher': M(['triceps'], 'Lower to the forehead; elbows fixed in place.')\n    };\n  }\n  days() {\n    const W1 = ['5 min brisk incline treadmill walk', 'Arm circles ×15 each way + shoulder rolls ×10', '2 light sets of the first lift — 50% then 70% of work weight'];\n    const W2 = ['5 min brisk incline treadmill walk', 'Band pull-aparts ×15 + cat-camel ×10', '2 light sets of lat pulldown'];\n    const W3 = ['5 min easy cycle or incline walk', 'Leg swings ×12 each leg + bodyweight squats ×15', '2 light sets of squats — bar only, then 50%'];\n    const CARDIO = '12 min incline treadmill walk after lifting — incline 8–10%, speed 5.5–6 km/h. Brisk, not breathless.';\n    return [\n      { label: 'Mon', name: 'Push', full: 'Chest · Shoulders · Triceps', type: 'train', warmup: W1, cardio: CARDIO, core: [], ex: [\n        { n: 'Barbell bench press', s: '4 × 6–8', r: '2–3 min', alt: 'Flat dumbbell press' },\n        { n: 'Incline dumbbell press', s: '3 × 8–10', r: '90 sec', alt: 'Incline machine press' },\n        { n: 'Seated dumbbell shoulder press', s: '3 × 8–10', r: '90 sec', alt: 'Machine shoulder press' },\n        { n: 'Dumbbell lateral raise', s: '3 × 12–15', r: '60 sec', alt: 'Cable lateral raise' },\n        { n: 'Pec-deck / cable fly', s: '3 × 12–15', r: '60 sec', alt: 'Dumbbell fly, flat bench' },\n        { n: 'Rope triceps pushdown', s: '3 × 10–12', r: '60 sec', alt: 'Bench dips' },\n        { n: 'Overhead dumbbell triceps extension', s: '3 × 10–12', r: '60 sec', alt: 'Close-grip push-ups' }] },\n      { label: 'Tue', name: 'Pull', full: 'Back · Rear delts · Biceps', type: 'train', warmup: W2, cardio: CARDIO, core: [], ex: [\n        { n: 'Lat pulldown (or pull-ups)', s: '4 × 6–10', r: '2 min', alt: 'Assisted pull-up machine' },\n        { n: 'Barbell row', s: '4 × 8–10', r: '2 min', alt: 'Chest-supported machine row' },\n        { n: 'Seated cable row', s: '3 × 10–12', r: '90 sec', alt: 'Single-arm dumbbell row' },\n        { n: 'Face pull', s: '3 × 12–15', r: '60 sec', alt: 'Rear-delt machine fly' },\n        { n: 'EZ-bar curl', s: '3 × 8–10', r: '60–90 sec', alt: 'Dumbbell curl' },\n        { n: 'Hammer curl', s: '3 × 10–12', r: '60 sec', alt: 'Cable rope curl' }] },\n      { label: 'Wed', name: 'Legs + Core', full: 'Quads · Hamstrings · Glutes · Calves · Abs', type: 'train', warmup: W3,\n        cardio: 'Optional 8–10 min easy flat walk. Legs are the cardio today — don\\u2019t burn recovery.', core: ['Hanging knee raise — 3 × 10–15', 'Cable crunch — 3 × 12–15', 'Plank — 3 × 45–60 sec'], ex: [\n        { n: 'Barbell back squat', s: '4 × 6–8', r: '2–3 min', alt: 'Leg press or goblet squat' },\n        { n: 'Romanian deadlift', s: '3 × 8–10', r: '2 min', alt: 'Dumbbell RDL' },\n        { n: 'Leg press', s: '3 × 10–12', r: '90 sec', alt: 'Dumbbell Bulgarian split squat' },\n        { n: 'Lying leg curl', s: '3 × 10–12', r: '90 sec', alt: 'Seated leg curl / slow DB RDL' },\n        { n: 'Standing calf raise', s: '4 × 12–15', r: '60 sec', alt: 'Calf press on leg press' }] },\n      { label: 'Thu', name: 'Active Rest', full: 'Walk · Stretch · Recover', type: 'rest',\n        acts: ['30–40 min brisk walk — outdoors or treadmill, easy pace you could talk through', '10 min stretching: hip flexors, hamstrings, chest doorway stretch, child\\u2019s pose', 'Optional 10 min easy cycling if you feel stiff'],\n        note: 'Rest days are where muscle is actually built. Eat the rest-day menu (~2,050 kcal, protein stays at 145 g), hit your steps, sleep 7.5 h. No gym guilt — this day is part of the program.' },\n      { label: 'Fri', name: 'Upper Strength', full: 'Chest + Back heavy focus', type: 'train', warmup: W1, cardio: '12–15 min incline treadmill walk after lifting.', core: [], ex: [\n        { n: 'Incline barbell press', s: '4 × 6–8', r: '2–3 min', alt: 'Incline dumbbell press' },\n        { n: 'Weighted / assisted pull-up', s: '4 × 6–8', r: '2 min', alt: 'Heavy lat pulldown' },\n        { n: 'Flat dumbbell press', s: '3 × 8–10', r: '90 sec', alt: 'Machine chest press' },\n        { n: 'One-arm dumbbell row', s: '3 × 10–12', r: '90 sec', alt: 'Seated cable row' },\n        { n: 'Cable lateral raise', s: '3 × 12–15', r: '60 sec', alt: 'Dumbbell lateral raise' },\n        { n: 'Superset: EZ-bar curl + rope pushdown', s: '3 × 10–12', r: '60 sec after pair', alt: 'DB curl + bench dips' }] },\n      { label: 'Sat', name: 'Delts + Arms + Core', full: 'Shoulders · Biceps · Triceps · Abs', type: 'train', warmup: W1, cardio: '15 min incline treadmill walk — this is the week\\u2019s longest finisher.',\n        core: ['Hanging leg raise — 3 × 10–15', 'Side plank — 3 × 30–45 sec each side', 'Slow bicycle crunch — 3 × 15–20'], ex: [\n        { n: 'Standing barbell overhead press', s: '4 × 6–8', r: '2–3 min', alt: 'Seated dumbbell press' },\n        { n: 'Dumbbell lateral raise', s: '4 × 12–15', r: '60 sec', alt: 'Cable lateral raise' },\n        { n: 'Rear-delt dumbbell fly', s: '3 × 12–15', r: '60 sec', alt: 'Face pull' },\n        { n: 'Barbell curl', s: '3 × 8–10', r: '90 sec', alt: 'Alternating dumbbell curl' },\n        { n: 'Incline dumbbell curl', s: '3 × 10–12', r: '60 sec', alt: 'Cable curl' },\n        { n: 'Close-grip bench press', s: '3 × 8–10', r: '90 sec', alt: 'Dips' },\n        { n: 'Skull crusher', s: '3 × 10–12', r: '60 sec', alt: 'Rope overhead extension' }] },\n      { label: 'Sun', name: 'Full Rest', full: 'Check-in · Meal prep · Recharge', type: 'rest',\n        acts: ['Weekly check-in: weigh yourself, measure waist at the navel, take the progress photo (same spot, same light)', 'Casual walk with family / errands — steps still count', 'Prep for the week: soak chana &amp; moong for sprouts, stock curd, fruit, paneer'],\n        note: 'Full rest. Two rest days a week is deliberate — you\\u2019re coming back from a break, and recovery is where the rebuild happens. Fill the weekly check-in tab today.' }\n    ];\n  }\n  trainMeals() {\n    return [\n      { t: '5:45 AM', name: 'Pre-workout', items: ['1 banana', '4–5 soaked almonds', 'Black coffee (optional) + 500 ml water'], swap: 'No banana? 2–3 dates or 1 apple. Keep it light — you train in 20–30 min.' },\n      { t: '7:45 AM', name: 'Post-workout', items: ['1.5 scoops whey (~40 g powder) in water', '2 dates or 1 banana'], swap: 'No whey today? 1 big glass milk + 2 tbsp peanuts holds you till breakfast.' },\n      { t: '9:00 AM', name: 'Breakfast', items: ['3 besan chilla (≈1 cup besan) loaded with onion, tomato, methi', '1 katori curd + green chutney'], swap: 'Masala oats 60 g + curd · poha 1.5 katori with extra peanuts + 1 glass milk · vegetable upma + curd.' },\n      { t: '11:30 AM', name: 'Mid-morning', items: ['1 fruit (apple / papaya / guava)', '1 glass chaas', '1 tbsp chia — soak 20 min, stir into the chaas or water'], swap: 'Any seasonal whole fruit. Never juice.' },\n      { t: '1:30 PM', name: 'Lunch', items: ['3 roti, or 2 roti + 1 bajra rotla (thin ghee is fine, counted)', 'Dal 1.5 katori — thick, not watery', 'Sabzi 1 katori', 'Kachumber salad + 1 katori curd', 'Rice ½ katori (optional — then drop 1 roti)'], swap: 'No dal? Kadhi + ½ katori extra curd, or rajma / chole 1.5 katori.' },\n      { t: '4:30 PM', name: 'Evening snack', items: ['Sprouts chaat 1 big cup — moong/chana, onion, tomato, lemon', 'Roasted chana ½ katori or peanuts 30 g'], swap: 'Chaas + 30 g mixed dry fruits (one small handful — that\\u2019s the whole day\\u2019s quota).' },\n      { t: '7:45 PM', name: 'Dinner', items: ['Paneer bhurji or tawa paneer 125–150 g (light oil)', '2 roti, or 1.5 katori moong-dal khichdi + 1 katori kadhi', 'Sabzi or a big salad'], swap: 'No paneer? Khichdi-kadhi tonight + 1 glass milk before bed covers the protein.' },\n      { t: '10:00 PM', name: 'Before bed (optional)', items: ['1 glass warm toned milk, pinch of haldi'], swap: 'Skip if dinner ran late — lights out matters more.' }\n    ];\n  }\n  restMeals() {\n    return [\n      { t: '7:30 AM', name: 'Breakfast', items: ['1 scoop whey in milk or water', 'Vegetable upma or masala oats 1.5 katori', '5 almonds + 2 walnuts'], swap: 'Besan chilla ×3 + curd works exactly the same.' },\n      { t: '11:00 AM', name: 'Mid-morning', items: ['1 fruit', '1 glass chaas with 1 tbsp soaked chia'], swap: 'Coconut water + fruit if you\\u2019re out.' },\n      { t: '1:30 PM', name: 'Lunch', items: ['2–3 roti (skip rice today)', 'Dal 1.5 katori', 'Sabzi 1 katori', 'Kachumber + 1 katori curd'], swap: 'Rajma / chole 1.5 katori instead of dal.' },\n      { t: '4:30 PM', name: 'Evening snack', items: ['Sprouts chaat 1 cup or roasted chana ½ katori', 'Green tea or chaas'], swap: '30 g dry fruits if sprouts aren\\u2019t ready.' },\n      { t: '7:45 PM', name: 'Dinner', items: ['Moong-dal khichdi 1.5 katori + kadhi 1 katori + 1 tsp ghee', 'or 2 roti + paneer sabzi 100–125 g', 'Big salad'], swap: 'Dal-dhokli (light on ghee) once a week is a fine dinner here.' },\n      { t: '10:00 PM', name: 'Before bed (optional)', items: ['1 glass warm toned milk'], swap: 'Skip if not hungry — rest day runs ~150 kcal lighter.' }\n    ];\n  }\n  renderVals() {\n    const S = this.state, INK = '#17140E', PAPER = '#FFFDF7', ACC = '#C2410C';\n    const days = this.days();\n    const sel = days[S.sel];\n    const todayIdx = (new Date().getDay() + 6) % 7;\n    const showAlt = this.props.showAlternatives ?? true;\n    const waterT = this.props.waterLitres ?? 3;\n    const stepT = this.props.stepTarget ?? 8000;\n    const tabs = [['today', 'Today\\u2019s Plan'], ['weekly', 'Weekly Check-in'], ['guide', 'Plan Guide']].map(([id, label]) => ({\n      label, on: () => this.setState({ tab: id }), bg: S.tab === id ? INK : 'transparent', fg: S.tab === id ? '#F2EFE7' : INK }));\n    const dayChips = days.map((d, i) => ({ label: d.label, sub: d.name, isToday: i === todayIdx,\n      on: () => this.setState({ sel: i, checks: this.loadChecks(i), setsDone: this.loadSetsDone(i), openEx: null, timer: null }),\n      bg: i === S.sel ? INK : PAPER, fg: i === S.sel ? '#F2EFE7' : INK, bd: i === S.sel ? INK : '#E2DCCA' }));\n    const isTrain = sel.type === 'train';\n    const checkItems = [isTrain ? 'Workout done (all lifts logged mentally or on phone)' : 'Rest-day walk / stretching done',\n      isTrain ? 'Cardio finisher done' : 'Stayed active — no full couch day',\n      stepT.toLocaleString('en-IN') + ' steps', 'Water ' + waterT + ' L', 'Protein ~145 g (whey + paneer/dal + dairy)',\n      'Slept 7 h+ last night', 'No fried snacks / mithai / juice'];\n    const checkRows = checkItems.map((label, i) => { const done = !!S.checks[i]; return { label,\n      on: () => { const c = { ...S.checks, [i]: !done }; this.saveChecks(S.sel, c); this.setState({ checks: c }); },\n      bg: done ? '#F0EADA' : PAPER, bd: done ? '#D6CEB8' : '#E2DCCA', fg: done ? '#8A8272' : INK,\n      boxBg: done ? ACC : 'transparent', boxBd: done ? ACC : '#C9C1AC', mark: done ? '\\u2713' : '' }; });\n    const doneCount = checkItems.filter((_, i) => S.checks[i]).length;\n    const statCards = [\n      { k: 'Calories', v: isTrain ? '≈2,200' : '≈2,050' }, { k: 'Protein', v: '140–150 g' },\n      { k: 'Water', v: waterT + ' L' }, { k: 'Steps', v: stepT.toLocaleString('en-IN') },\n      { k: 'Cardio', v: isTrain ? (S.sel === 2 ? 'Optional' : '12–15 min') : '30–40 min walk' }, { k: 'Sleep', v: '7–8 h' }];\n    const draft = S.draft;\n    const setD = (k, v) => this.setState({ draft: { ...draft, [k]: v }, saved: false });\n    const fields = [['weight', 'Body weight', 'kg'], ['waist', 'Waist at navel', 'cm'], ['bench', 'Bench press top set', 'kg'], ['squat', 'Squat top set', 'kg'], ['pulldown', 'Lat pulldown top set', 'kg'], ['ohp', 'Overhead press top set', 'kg']]\n      .map(([k, label, unit]) => ({ label, unit, val: draft[k], on: (e) => setD(k, e.target.value) }));\n    const mkOpts = (k, from, to) => { const o = []; for (let v = from; v <= to; v++) { const on = draft[k] === v; o.push({ v: String(v),\n      on: () => setD(k, v), bg: on ? INK : '#F5F1E6', fg: on ? '#F2EFE7' : INK, bd: on ? INK : '#E2DCCA' }); } return o; };\n    const ratingRows = [\n      { label: 'Workouts completed this week', opts: mkOpts('workouts', 0, 5) },\n      { label: 'Energy levels (1 low → 5 high)', opts: mkOpts('energy', 1, 5) },\n      { label: 'Sleep quality (1–5)', opts: mkOpts('sleepq', 1, 5) },\n      { label: 'Diet adherence (1–5)', opts: mkOpts('diet', 1, 5) },\n      { label: 'Progress photo taken?', opts: [{ v: 'Yes', on: () => setD('photo', true), bg: draft.photo ? INK : '#F5F1E6', fg: draft.photo ? '#F2EFE7' : INK, bd: draft.photo ? INK : '#E2DCCA' }, { v: 'No', on: () => setD('photo', false), bg: draft.photo === false ? INK : '#F5F1E6', fg: draft.photo === false ? '#F2EFE7' : INK, bd: draft.photo === false ? INK : '#E2DCCA' }] }];\n    const saveWeek = () => {\n      const entry = { date: this.fmt(new Date()), ...draft };\n      const entries = [entry, ...S.entries];\n      localStorage.setItem('vfit-weekly', JSON.stringify(entries));\n      this.setState({ entries, saved: true, draft: { weight:'', waist:'', bench:'', squat:'', pulldown:'', ohp:'', workouts:null, energy:null, sleepq:null, diet:null } });\n    };\n    const entryRows = S.entries.map((e) => ({ date: e.date,\n      body: (e.weight ? e.weight + ' kg' : '—') + ' · waist ' + (e.waist ? e.waist + ' cm' : '—'),\n      detail: 'Workouts ' + (e.workouts ?? '—') + '/5 · bench ' + (e.bench || '—') + ' · squat ' + (e.squat || '—') + ' · pulldown ' + (e.pulldown || '—') + ' · OHP ' + (e.ohp || '—') + ' · energy ' + (e.energy ?? '—') + ' · sleep ' + (e.sleepq ?? '—') + ' · diet ' + (e.diet ?? '—') + (e.photo ? ' · photo \\u2713' : '') }));\n    const META = this.exMeta(), MNAME = { chest: 'Chest', delts: 'Delts', rearDelts: 'Rear delts', biceps: 'Biceps', triceps: 'Triceps', forearms: 'Forearms', abs: 'Core', quads: 'Quads', hamstrings: 'Hamstrings', glutes: 'Glutes', calves: 'Calves', lats: 'Lats', traps: 'Traps', lowerBack: 'Lower back' };\n    const MUSK = Object.keys(MNAME);\n    let selSetsDone = 0, selSetsTotal = 0;\n    const selEx = (sel.ex || []).map((e, i) => {\n      const key = S.sel + '-' + i, meta = META[e.n] || { mus: [], cue: '' };\n      const open = S.openEx === key, fills = {};\n      MUSK.forEach((m) => { fills['m' + m] = meta.mus.includes(m) ? '#E8946B' : 'rgba(255,255,255,.13)'; });\n      const log = S.exlog[e.n] || [], last = log[log.length - 1];\n      let spark = '';\n      if (log.length > 1) {\n        const ws = log.slice(-12).map((x) => +x.w || 0), mn = Math.min(...ws), mx = Math.max(...ws);\n        spark = ws.map((w, j) => (4 + j * (132 / (ws.length - 1))).toFixed(1) + ',' + (mx === mn ? 18 : 32 - ((w - mn) / (mx - mn)) * 26).toFixed(1)).join(' ');\n      }\n      const setCount = parseInt((e.s.match(/\\d+/) || [null, 3])[0]) || 3;\n      const doneArr = S.setsDone[i] || new Array(setCount).fill(false);\n      const setsArr = doneArr.slice(0, setCount).map((done, si) => ({ n: si + 1, done,\n        bg: done ? ACC : 'rgba(255,255,255,.08)', bd: done ? ACC : 'rgba(255,255,255,.28)', fg: done ? '#fff' : '#CFC7B4',\n        on: () => this.toggleSet(i, si, setCount, e.r) }));\n      const exDone = doneArr.filter(Boolean).length;\n      selSetsDone += exDone; selSetsTotal += setCount;\n      return { ...e, ...fills, i: String(i + 1).padStart(2, '0'), altText: showAlt ? e.alt : '', open, chev: open ? '\\u2212' : '+',\n        cue: meta.cue, targetLine: meta.mus.map((m) => MNAME[m]).join(' \\u00b7 '),\n        toggle: () => this.setState({ openEx: open ? null : key, logW: '', logR: '' }),\n        setsArr, setBadge: exDone + '/' + setCount, setBadgeDone: exDone === setCount ? '#E8946B' : '#CFC7B4',\n        lastLine: last ? 'Last: ' + last.w + ' kg \\u00d7 ' + (last.r || '?') + ' reps \\u00b7 ' + last.d : 'No sets logged yet \\u2014 the first entry becomes your baseline.',\n        hasSpark: log.length > 1, spark,\n        save: () => {\n          const w = parseFloat(S.logW); if (!isFinite(w) || w <= 0) return;\n          const r = parseInt(S.logR);\n          const nl = [...log, { d: this.fmt(new Date()), w, r: isFinite(r) ? r : '' }];\n          const exlog = { ...S.exlog, [e.n]: nl };\n          localStorage.setItem('vfit-exlog', JSON.stringify(exlog));\n          this.setState({ exlog, logW: '', logR: '' });\n        } };\n    });\n    const timerActive = !!S.timer;\n    const timerLabel = timerActive ? String(Math.floor(S.timer.left / 60)).padStart(2, '0') + ':' + String(S.timer.left % 60).padStart(2, '0') : '';\n    const timerPct = timerActive ? Math.round(((S.timer.total - S.timer.left) / S.timer.total) * 100) : 0;\n    const timerDone = timerActive && S.timer.left <= 0;\n    const chron = [...S.entries].reverse();\n    const nums = (k) => chron.map((e) => parseFloat(e[k])).filter(isFinite);\n    const seriesPts = (v, W, H) => v.length < 2 ? '' : (() => { const mn = Math.min(...v), mx = Math.max(...v);\n      return v.map((x, j) => (8 + j * ((W - 16) / (v.length - 1))).toFixed(1) + ',' + (mx === mn ? H / 2 : (H - 10) - ((x - mn) / (mx - mn)) * (H - 20)).toFixed(1)).join(' '); })();\n    const wVals = nums('weight'), waVals = nums('waist');\n    const liftTrends = [['bench', 'Bench press'], ['squat', 'Squat'], ['pulldown', 'Lat pulldown'], ['ohp', 'Overhead press']].map(([k, label]) => {\n      const v = nums(k); return { label, has: v.length > 1, pts: seriesPts(v, 150, 34), last: v.length ? v[v.length - 1] + ' kg' : '\\u2014' }; });\n    let daysChecked = 0; try { for (let i = 0; i < localStorage.length; i++) { if ((localStorage.key(i) || '').indexOf('vfit-checks-') === 0) daysChecked++; } } catch (e) {}\n    const setsLogged = Object.values(S.exlog).reduce((a, b) => a + b.length, 0);\n    const exportData = () => {\n      const out = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('vfit-') === 0) out[k] = localStorage.getItem(k); } } catch (e) {}\n      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));\n      a.download = 'rebuild-plan-backup-' + this.iso(new Date()) + '.json'; a.click();\n    };\n    const importData = (ev) => {\n      const f = ev.target.files && ev.target.files[0]; if (!f) return;\n      const r = new FileReader();\n      r.onload = () => { try { const obj = JSON.parse(r.result);\n        Object.keys(obj).forEach((k) => { if (k.indexOf('vfit-') === 0) localStorage.setItem(k, obj[k]); });\n        this.setState({ entries: JSON.parse(localStorage.getItem('vfit-weekly') || '[]'), exlog: this.loadExlog(), checks: this.loadChecks(this.state.sel) });\n      } catch (err) { alert('Could not read that backup file.'); } };\n      r.readAsText(f); ev.target.value = '';\n    };\n    return {\n      todayLabel: new Date().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }),\n      tabs, isToday: S.tab === 'today', isWeekly: S.tab === 'weekly', isGuide: S.tab === 'guide',\n      dayChips, selName: sel.name, selFull: sel.full, selDateLabel: this.fmt(this.dateFor(S.sel)),\n      statCards, selIsTrain: isTrain, selIsRest: !isTrain,\n      selWarmup: sel.warmup || [], selCardio: sel.cardio || '',\n      selSetsDone, selSetsTotal, setsProgressLabel: isTrain ? (selSetsDone + ' / ' + selSetsTotal + ' sets done') : '',\n      timerActive, timerLabel, timerPct, timerDone,\n      skipTimer: () => this.setState({ timer: null }),\n      selEx, logW: S.logW, logR: S.logR,\n      onLogW: (e) => this.setState({ logW: e.target.value }), onLogR: (e) => this.setState({ logR: e.target.value }),\n      selHasCore: !!(sel.core && sel.core.length), selCore: sel.core || [],\n      selRestActs: sel.acts || [], selRestNote: sel.note || '',\n      selMeals: isTrain ? this.trainMeals() : this.restMeals(),\n      macroLine: isTrain ? '≈2,200 kcal · P 145 g · C 235 g · F 65 g' : '≈2,050 kcal · P 145 g · C 200 g · F 62 g',\n      checkRows, checkPct: Math.round((doneCount / checkItems.length) * 100),\n      fields, ratingRows, saveWeek, saveLabel: S.saved ? 'Saved \\u2713' : 'Save this week\\u2019s check-in',\n      hasEntries: S.entries.length > 0, noEntries: S.entries.length === 0, entryRows,\n      hasWChart: wVals.length > 1, wPts: seriesPts(wVals, 460, 120), wFirst: wVals[0], wLast: wVals[wVals.length - 1],\n      hasWaChart: waVals.length > 1, waPts: seriesPts(waVals, 460, 120), waFirst: waVals[0], waLast: waVals[waVals.length - 1],\n      noChart: wVals.length < 2 && waVals.length < 2, liftTrends,\n      statWeeks: S.entries.length, statSets: setsLogged, statDays: daysChecked,\n      exportData, importData\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
